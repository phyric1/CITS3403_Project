{% extends "base.html" %}

{% block title %}Game{% endblock %}

{% block content %}
<style>
/* this style block is temporary */
#game-container {
    height: 50vh;
    background-color: rgb(69, 69, 69);
}

#game-info{
    background-color: rgb(71, 71, 71);
    border: 1px solid #000000;
}

#card-display {
    background-color: rgb(52, 52, 52);
    border: 1px solid black;
    height: 30vh;
    padding: 10px;
}

</style>
<h3>Dungeon Crawler</h3>
    <div class="container-fluid row">

        <div class="col-md-9">
            <div id="game-container">
                <div id="grid">
                </div>
            </div>
            <div class="d-flex" id="card-display">
                <div>
                <h2>Deck</h2>
                <p>Cards Left: 35/40</p>
                </div>
            </div>
        </div>

        <div id="game-info" class="col-md-3">   
            <h2>Game Info</h2>
            <p>Health: <span id="health-value">100</span></p>
            <p>Stealth: <span id="stealth-value">100</span></p>
            <p>Treasure: <span id="treasure-value">100</span></p>

            <p>Dificulty: <span id="difficulty-value">Normal</span></p>
            <p>Floor: <span id="floor-value">1/10</span></p>

            <p>Turn: <span id="turn-value">20</span></p>
            <p>Cards Left: <span id="cards-left-value">25</span></p>

            <p>Active Cards</p>
            <p>Last Used Card: <span id="last-used-value">None</span></p>

        </div>
    </div>

{% endblock %}
