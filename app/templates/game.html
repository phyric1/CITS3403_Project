{% extends "base.html" %}

{% block title %}Game{% endblock %}

{% block extra_links %}
<link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
{% endblock %}

{% block content %}
    <div class="container-fluid game-layout p-1">
        <div class="row h-100 g-2">
            <div class="left-panel col-lg-9 d-flex flex-column">
                <div class="bg-secondary bg-game" id="game-container">
                    <div id="grid"></div>
                    <div id="game-overlay" class="game-overlay d-none">
                        <div class="game-overlay-content">
                            <h2 id="game-overlay-title"></h2>
                            <p id="game-overlay-text"></p>
                            <div id="game-overlay-stats" class="game-overlay-stats"></div>
                            <button id="game-overlay-button" class="btn btn-primary mt-3">Continue</button>
                        </div>
                    </div>
                </div>
                <div id="card-display" class="right-panel bg-dark rounded-4 p-3 d-flex align-items-start gap-4">
                    <div class="deck-info text-light px-3 py-2 rounded-3">
                        <div class="small text-uppercase text-secondary">
                            Deck
                        </div>

                        <div class="fs-3 fw-bold">
                            <span id="deck-size">35</span>/<span id="deck-max">40</span>
                        </div>

                        <div class="small text-secondary">
                            Cards Remaining
                        </div>
                        <div class="info-divider"></div>
                        <button class="btn btn-sm btn-danger w-100 mt-1" id="reset" onclick="resetGame()">Reset Game</button>
                    </div>

                    <div id="hand-cards" class="d-flex flex-wrap gap-3 flex-grow-1">
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div id="game-info" class="bg-dark rounded-4 p-3">
                    <h2 class="text-light mb-0">
                        Game Info
                    </h2>
                    <div class="info-section">
                        <div class="stat-card">
                            <span class="stat-label">Turn</span>
                            <span class="stat-value" id="turn-value">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Health</span>
                            <span class="stat-value" id="health-value">3</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Stealth</span>
                            <span class="stat-value" id="stealth-value">7</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Treasure</span>
                            <span class="stat-value" id="treasure-value">5</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Keys</span>
                            <span class="stat-value" id="keys-value">0</span>
                        </div>
                    </div>
                    <div class="info-divider"></div>
                    <div class="info-section">
                        <div class="stat-card">
                            <span class="stat-label">Difficulty</span>
                            <span class="stat-value" id="difficulty-value">
                                Normal
                            </span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Floor</span>
                            <span class="stat-value" id="floor-value">1</span>
                            <span class="stat-value"> / </span>
                            <span class="stat-value" id="floor-max">1</span>
                        </div>
                    </div>
                    <div class="info-divider"></div>
                    <div>
                        <div class="small text-uppercase text-secondary mb-2">
                            Last Used Card
                        </div>
                        <div id="discard" class="discard-slot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="{{ url_for('static', filename='game.js') }}"></script>
{% endblock %}
