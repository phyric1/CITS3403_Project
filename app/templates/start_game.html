{% extends "base.html" %}

{% block title %}Game{% endblock %}

{% block extra_links %}
<link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
<script src="{{ url_for('static', filename='game.js') }}"></script>
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row g-4">
        <div class="col-12 col-md-4">
            <div class="card glass-card p-3 h-100">
                <h3 class="mb-3">Start Game</h3>

                <label for="difficulty" class="form-label">Difficulty</label>
                <select id="difficulty" class="form-select mb-3">
                    <option value="Easy">Easy</option>
                    <option value="Normal" selected>Normal</option>
                    <option value="Hard">Hard</option>
                </select>

                <button class="btn btn-primary w-100" onclick="startGame()">
                    Start New Game
                </button>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card glass-card p-3 h-100">
                <h3 class="mb-3">Progress</h3>

                <div class="d-flex justify-content-between mb-2">
                    <span>Rewards</span>
                    <span id="rewards-value">0</span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Floor Count</span>
                    <span id="floor-count">0</span>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card glass-card p-3 h-100">
                <h3 class="mb-3">Deck Info</h3>

                <div id="deck-info">
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
