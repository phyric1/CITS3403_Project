{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>{{ username }}'s Inventory</h2>
        <div>
            <!-- TODO: Change to only appear if user who's inventory is being viewed is the one logged in -->
            <a class="btn btn-success">
                Manage Deck
            </a>
            <a href="{{ url_for('profile',username=username) }}" class="btn btn-outline-primary">
                Back to Profile
            </a>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <form method="GET">
            <select name="sort" class="form-select" onchange="this.form.submit()">
                <option value="">Sort</option>
                <option value="name">Name</option>
                <option value="rarity">Rarity</option>
                <option value="type">Type</option>
                <option value="max">Max</option>
            </select>
        </form>
    </div>

    <div class="row g-3">
        {% for item in items %}
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                <div class="inventory-card-wrapper">
                    {% include "_card.html" %}
                    {% if item.count and item.count > 1 %}
                    <div class="card-count">
                        x{{ item.count }}
                    </div>
                    {% endif %}
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
