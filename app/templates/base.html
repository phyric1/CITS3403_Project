<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dungeon Dealer{% endblock %}</title>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    {% block extra_links %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</head>

<body>
    {% block navbar %}
    <nav class=" navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">Dungeon Dealer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'game' %}active{% endif %}"
                            href="{{ url_for('main.game') }}">Game</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'leaderboard' %}active{% endif %}"
                            href="{{ url_for('main.leaderboard') }}">Leaderboard</a>
                    </li>
                    {% if session.get("user_id") %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}"
                                href="{{ url_for('main.profile',username=session.get('username')) }}">Profile</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link">
                                {{session.get("username")}}
                            </span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'logout' %}active{% endif %}"
                                href="{{ url_for('main.logout') }}">Log Out</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'register' %}active{% endif %}"
                                href="{{ url_for('main.register') }}">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'login' %}active{% endif %}"
                                href="{{ url_for('main.login') }}">Log In</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    {% endblock %}

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
