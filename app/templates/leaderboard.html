{% extends "base.html" %}

{% block title %}Leaderboard{% endblock %}

{% block content %}
<div class="container py-4 min-vh-100">
  <div class="text-center mb-4">
    <h1 class="fw-bold">Leaderboard</h1>
    <p class="text-muted mb-0">Top players ranked by performance</p>
  </div>

  <div class="text-white rounded shadow">

    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover align-middle mb-0">

        <thead class="table-light text-dark">
          <tr>
            <th class="text-center" style="width: 80px;">
              <a class="text-decoration-none {% if sort == 'ranking' %}fw-bold text-decoration-underline{% endif %}"
                 href="{{ url_for('main.leaderboard', sort='ranking') }}">
                Rank
              </a>
            </th>

            <th class="text-center">
              <a class="text-decoration-none {% if sort == 'player' %}fw-bold text-decoration-underline{% endif %}"
                 href="{{ url_for('main.leaderboard', sort='player') }}">
                Player
              </a>
            </th>

            <th class="text-center">
              <a class="text-decoration-none {% if sort == 'stat1' %}fw-bold text-decoration-underline{% endif %}"
                 href="{{ url_for('main.leaderboard', sort='stat1') }}">
                Stat 1
              </a>
            </th>

            <th class="text-center">
              <a class="text-decoration-none {% if sort == 'stat2' %}fw-bold text-decoration-underline{% endif %}"
                 href="{{ url_for('main.leaderboard', sort='stat2') }}">
                Stat 2
              </a>
            </th>
          </tr>
        </thead>

        <tbody>
          {% for row in players %}
          <tr>
            <th class="text-center">{{ row.ranking }}</th>
            <td class="text-center">{{ row.player }}</td>
            <td class="text-center">{{ row.stat1 }}</td>
            <td class="text-center">{{ row.stat2 }}</td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>

  </div>

</div>
{% endblock %}
